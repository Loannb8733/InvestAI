name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"

jobs:
  # ──────────────────────────────────────────
  # Backend: Lint (ruff, bandit)
  # ──────────────────────────────────────────
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install lint tools
        run: |
          pip install --upgrade pip
          grep -E '^(ruff|mypy|bandit\[toml\])==' backend/requirements-dev.txt > /tmp/lint-tools.txt
          pip install -r /tmp/lint-tools.txt

      - name: Lint (ruff)
        run: ruff check backend

      - name: Format (ruff)
        run: ruff format --check backend

      - name: Security (bandit)
        run: bandit -c pyproject.toml -r backend/app

  # ──────────────────────────────────────────
  # Code rules: 300 lignes max, aucun commentaire
  # ──────────────────────────────────────────
  code-rules:
    name: Code Rules
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check code rules
        run: python scripts/check_code_rules.py

  # ──────────────────────────────────────────
  # Backend: Tests (pytest)
  # ──────────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: timescale/timescaledb:latest-pg15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          # Base DB name; conftest derives the test DB as "<name>_test".
          POSTGRES_DB: investai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: investai
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      SECRET_KEY: test-secret-key-for-ci-only-0123456789
      FERNET_KEY: icQAqvAxUzGIr5HCiFPkDICQtKw_tIwRDbCnZW0HW6M=
      APP_ENV: testing
      DEBUG: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev postgresql-client

      - name: Create test database
        env:
          PGPASSWORD: test
        run: |
          # conftest connects to "<POSTGRES_DB>_test"; create it once here.
          psql -h localhost -U test -d investai -c "CREATE DATABASE investai_test;"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Type check (mypy)
        run: mypy --config-file ../pyproject.toml app

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  # ──────────────────────────────────────────
  # Frontend: Lint (ESLint + TypeScript)
  # ──────────────────────────────────────────
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type check (TypeScript)
        run: npx tsc --noEmit

      # Les URL du client sont ecrites a la main : rien ne les relie aux routes
      # que FastAPI declare. Une route renommee d'un cote fait partir l'appel en
      # 404, que le client traite comme une erreur reseau ordinaire.
      - name: Les appels du client visent des routes existantes
        working-directory: .
        run: python3 scripts/verifier_routes_client.py

  # ──────────────────────────────────────────
  # Frontend: Tests (Vitest)
  # ──────────────────────────────────────────
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: frontend-lint
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npx vitest run --coverage
        env:
          VITE_API_URL: http://localhost:8000/api/v1

      - name: Upload coverage
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

  # ──────────────────────────────────────────
  # Docker: Build validation
  # ──────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t investai-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t investai-frontend:ci --target production ./frontend
