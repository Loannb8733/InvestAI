name: Scheduled Tasks

on:
  schedule:
    - cron: "10 0 * * *"
  workflow_dispatch:
    inputs:
      task:
        description: "sync-goals, invariants-check, ou jobs/<tâche de la planification> (ex. jobs/check-alerts)"
        required: true
        default: sync-goals
        type: string

env:
  BASE_URL: https://investai-api.onrender.com/api/v1/cron

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger task
        env:
          TASK: ${{ github.event.inputs.task || 'sync-goals' }}
        run: |
          echo "Triggering $TASK"
          code=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" --max-time 1800 \
            -X POST "${BASE_URL}/${TASK}" \
            -H "X-Cron-Token: ${{ secrets.CRON_SECRET }}")
          echo "HTTP $code"; cat /tmp/resp.txt
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]
