name: investai

x-app: &app
  build:
    context: ../../backend
    dockerfile: Dockerfile.render
    args:
      WITH_PROPHET: "true"
  image: investai-app
  env_file: .env
  depends_on:
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  api:
    <<: *app
    environment:
      PORT: "8000"
      REDIS_URL: redis://redis:6379/0
      CELERY_WORKER_AVAILABLE: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  worker:
    <<: *app
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_WORKER_AVAILABLE: "true"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    command: >-
      celery -A app.tasks.celery_app worker --beat --loglevel=info --concurrency=2
      --schedule=/beat/celerybeat-schedule --without-heartbeat --without-gossip --without-mingle
    volumes:
      - beat_schedule:/beat
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  caddy:
    image: caddy:2.8-alpine
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN manquant dans .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  redis_data:
  beat_schedule:
  caddy_data:
  caddy_config:
