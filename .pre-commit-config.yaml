repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # ── Sécurité: secrets & fichiers ──
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json
      - id: no-commit-to-branch
        args: [--branch=main]

  # ── Sécurité: Python ──
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.7
    hooks:
      - id: bandit
        args: [-c, pyproject.toml, -r]
        files: ^backend/app/
        exclude: ^backend/(tests|alembic)/
        additional_dependencies: ["bandit[toml]"]

  # ── Frontend: ESLint ──
  - repo: local
    hooks:
      - id: frontend-eslint
        name: Frontend ESLint
        entry: bash -c 'cd frontend && ./node_modules/.bin/eslint --ext ts,tsx src/'
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false

      - id: code-rules
        name: Code rules (300 lignes, aucun commentaire)
        entry: python3 scripts/check_code_rules.py
        language: system
        files: ^(backend/app/.*\.py|frontend/src/.*\.(ts|tsx))$
        pass_filenames: false

      - id: frontend-typecheck
        name: Frontend TypeScript
        entry: bash -c 'cd frontend && ./node_modules/.bin/tsc --noEmit'
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false
