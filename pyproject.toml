[tool.ruff]
line-length = 120
target-version = "py312"
src = ["backend"]
extend-exclude = ["backend/alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP", "B", "SIM", "RUF", "BLE", "C901", "PLR0915"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"!backend/app/domains/**" = ["N", "B", "SIM", "RUF", "BLE", "C901", "PLR0915", "E402", "E501", "E712", "E741", "UP042"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
no_strict_optional = true
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
plugins = ["sqlalchemy.ext.mypy.plugin"]
exclude = ["backend/alembic/", "backend/tests/"]

[[tool.mypy.overrides]]
module = [
    "redis.*",
    "celery.*",
    "prophet.*",
    "xgboost.*",
    "pmdarima.*",
    "statsmodels.*",
    "optuna.*",
    "shap.*",
    "ta.*",
    "reportlab.*",
    "weasyprint.*",
    "openpyxl.*",
    "xlsxwriter.*",
    "aiohttp.*",
    "slowapi.*",
    "jose.*",
    "pyotp.*",
    "qrcode.*",
    "sentry_sdk.*",
]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["backend/tests", "backend/alembic"]
skips = ["B101", "B110", "B112", "B301", "B324", "B403"]
