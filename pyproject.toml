[tool.ruff]
line-length = 120
target-version = "py312"
src = ["backend"]
extend-exclude = ["backend/alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP", "B", "SIM", "RUF", "BLE", "C901", "PLR0915"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"!backend/app/{domains/**,core/db/**,core/errors.py,core/error_handlers.py}" = ["N", "B", "SIM", "RUF", "BLE", "C901", "PLR0915", "E402", "E501", "E712", "E741", "UP042"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
no_strict_optional = true
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
exclude = ["backend/alembic/", "backend/tests/"]

[[tool.mypy.overrides]]
module = ["app.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["app.domains.*", "app.core.db.*", "app.core.errors", "app.core.error_handlers"]
ignore_errors = false
strict_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[tool.bandit]
exclude_dirs = ["backend/tests", "backend/alembic"]
skips = ["B101", "B110", "B112", "B301", "B324", "B403"]
